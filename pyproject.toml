[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "lais-ai"
version = "2.0.0"
description = "Local AI System — Three autonomous agents with unified memory"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "CC BY-NC 4.0"}
keywords = ["ai", "agent", "voice", "assistant", "multi-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "customtkinter",
    "pillow",
    "psutil",
    "requests",
    "google-genai",
    "sounddevice",
    "PyQt6",
]

[project.optional-dependencies]
telegram = ["python-telegram-bot"]
discord = ["discord.py"]
messaging = ["python-telegram-bot", "discord.py", "aiohttp"]
all = [
    "python-telegram-bot",
    "discord.py",
    "aiohttp",
    "playwright",
    "duckduckgo-search",
    "beautifulsoup4",
    "opencv-python",
    "mss",
    "pyautogui",
    "pyperclip",
    "pygetwindow",
    "pywinauto",
    "comtypes",
    "pycaw",
    "win10toast",
    "send2trash",
    "youtube-transcript-api",
]

[project.urls]
Homepage = "https://github.com/StefSNS/LAIS--Local-AI-system"
Repository = "https://github.com/StefSNS/LAIS--Local-AI-system"
Documentation = "https://github.com/StefSNS/LAIS--Local-AI-system/tree/main/docs"
