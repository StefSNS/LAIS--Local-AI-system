[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "lais-ai"
version = "2.0.0"
description = "Local AI System — Three autonomous agents with unified memory"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "CC BY-NC 4.0"}
keywords = ["ai", "agent", "voice", "assistant", "multi-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.11",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "customtkinter",
    "pillow",
    "psutil",
    "requests",
    "google-genai",
    "sounddevice",
    "PyQt6",
]

[project.urls]
Homepage = "https://github.com/StefSNS/LAIS"
Repository = "https://github.com/StefSNS/LAIS"
