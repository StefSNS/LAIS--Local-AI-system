[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "localclaw"
version = "1.0.0"
description = "MARK XXXV - Real-time voice-driven personal AI assistant"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "CC BY-NC 4.0"}
authors = [
    {name = "JARVIS Systems"},
]

dependencies = [
    "sounddevice>=0.5.1",
    "google-genai>=1.0.0",
    "google-generativeai>=0.8.0",
    "pillow>=11.0.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "duckduckgo-search>=7.0.0",
    "playwright>=1.50.0",
    "pyautogui>=0.9.54",
    "pyperclip>=1.9.0",
    "pygetwindow>=0.0.9",
    "opencv-python>=4.10.0",
    "numpy>=2.0.0",
    "mss>=10.0.0",
    "psutil>=6.1.0",
    "comtypes>=1.4.0",
    "pycaw>=20240210",
    "win10toast>=0.9",
    "send2trash>=1.8.0",
    "youtube-transcript-api>=0.6.0",
    "pywinauto>=0.6.8",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/JARVIS-Systems/Mark-XXXV"
Source = "https://github.com/JARVIS-Systems/Mark-XXXV"

[project.scripts]
jarvis = "main:main"
lais-opencode = "models.ai_engine.bin.lais_opencode:main"
