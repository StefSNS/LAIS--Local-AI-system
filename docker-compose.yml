version: "3.8"

services:
  lais-a2a:
    build:
      context: .
      target: a2a-server
    container_name: lais-a2a
    ports:
      - "8020:8020"
    restart: unless-stopped
    volumes:
      - .:/app
    environment:
      - LAIS_TOKEN_OPTIMIZATION=1
    networks:
      - lais-net

  lais-vault:
    build:
      context: .
      target: vault-server
    container_name: lais-vault
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - .:/app
      - vault_data:/app/vault
    environment:
      - LAIS_VAULT_PATH=/app/vault
    networks:
      - lais-net

  lais-api:
    build:
      context: .
      target: api-server
    container_name: lais-api
    ports:
      - "8080:8080"
    restart: unless-stopped
    volumes:
      - .:/app
    depends_on:
      - lais-a2a
      - lais-vault
    environment:
      - LAIS_API_PORT=8080
      - LAIS_TOKEN_OPTIMIZATION=1
    networks:
      - lais-net

volumes:
  vault_data:

networks:
  lais-net:
    driver: bridge
